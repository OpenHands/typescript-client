name: Create Version Bump PRs

# Dispatched by npm-publish.yml after a successful publish to npmjs.org.
# Opens a PR in downstream consumers that pin an exact version of
# @openhands/typescript-client. Today the only exact-pinned consumer is
# OpenHands/agent-canvas; the other consumers float ("*") or track git HEAD
# and update themselves, so they are intentionally not bumped here.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to bump consumers to (e.g., 1.25.0)'
        required: true
        type: string

jobs:
  create-version-bump-prs:
    runs-on: ubuntu-latest
    # Bounds the npm-availability polling loop (up to 60 × 20s = 20 min) so a
    # stuck run cannot hold a runner slot for the 6-hour default.
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.OPENHANDS_BOT_GITHUB_TYPESCRIPT_CLIENT }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    steps:
      - name: Get version
        id: get_version
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          VERSION="$VERSION_INPUT"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format. Expected: X.Y.Z (e.g., 1.25.0)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Version: $VERSION"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      # agent-canvas resolves @openhands/typescript-client from the public npm
      # registry, so wait for the just-published version to be resolvable there
      # before regenerating its lockfile.
      - name: Wait for package to be available on npm
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail
          PKG="@openhands/typescript-client"
          MAX_ATTEMPTS=60
          SLEEP_SECONDS=20

          echo "⏳ Waiting for ${PKG}@${VERSION} on npmjs.org..."
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            if npm view "${PKG}@${VERSION}" version --registry=https://registry.npmjs.org > /dev/null 2>&1; then
              echo "✅ ${PKG}@${VERSION} is available on npm"
              break
            fi
            echo "  Attempt $ATTEMPT/$MAX_ATTEMPTS: not yet available, waiting ${SLEEP_SECONDS}s..."
            sleep $SLEEP_SECONDS
            ATTEMPT=$((ATTEMPT + 1))
          done
          if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
            echo "❌ Timeout waiting for ${PKG}@${VERSION} on npm"
            exit 1
          fi

      - name: Create PR for agent-canvas repo
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail

          REPO="OpenHands/agent-canvas"
          BRANCH="bump-ts-client-$VERSION"
          PKG="@openhands/typescript-client"

          echo "🔄 Creating PR for $REPO..."

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" agent-canvas-repo
          cd agent-canvas-repo

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            echo "⚠️ Branch $BRANCH already exists, checking it out"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

          # Pin the exact version in package.json, then refresh the lockfile.
          # --save-exact preserves agent-canvas's exact-pin style (otherwise npm
          # rewrites it to a caret range). --package-lock-only avoids a full
          # node_modules install; --ignore-scripts avoids consumer build hooks.
          sed -i -E 's#("@openhands/typescript-client": )"[^"]*"#\1"'"$VERSION"'"#' package.json
          npm install --package-lock-only --ignore-scripts --save-exact "${PKG}@${VERSION}"

          if git diff --quiet; then
            echo "⚠️ No changes detected in $REPO - version may already be up to date"
            exit 0
          fi

          git add package.json package-lock.json
          git commit -m "Bump @openhands/typescript-client to $VERSION" \
            -m "Automated version bump after npm release."
          git push -u origin "$BRANCH"

          EXISTING_PR=$(gh pr list --repo "$REPO" --head "$BRANCH" --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "✅ PR #$EXISTING_PR already exists for $REPO"
          else
            gh pr create \
              --repo "$REPO" \
              --title "Bump @openhands/typescript-client to v$VERSION" \
              --body "## Automated Version Bump

          This PR updates \`@openhands/typescript-client\` to version **$VERSION**.

          **Triggered by:** Release of [typescript-client v$VERSION](https://github.com/OpenHands/typescript-client/releases/tag/v$VERSION)

          ---
          _This PR was automatically created by the version-bump-prs workflow._" \
              --base main \
              --head "$BRANCH"
            echo "✅ PR created for $REPO"
          fi

      - name: Summary
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          {
            echo "## ✅ Version Bump PR Created"
            echo ""
            echo "Bumped \`@openhands/typescript-client\` to **$VERSION** in:"
            echo ""
            echo "- [agent-canvas](https://github.com/OpenHands/agent-canvas/pulls?q=is%3Apr+bump-ts-client-$VERSION)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack
        if: env.SLACK_BOT_TOKEN != ''
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          method: chat.postMessage
          token: ${{ env.SLACK_BOT_TOKEN }}
          payload: |
            channel: C08E1SYKEM9
            text: "🚀 *typescript-client v${{ steps.get_version.outputs.version }} published to npm!*\n\nVersion bump PR created:\n• <https://github.com/OpenHands/agent-canvas/pulls?q=is%3Apr+bump-ts-client-${{ steps.get_version.outputs.version }}|agent-canvas>\n\n<https://github.com/OpenHands/typescript-client/releases/tag/v${{ steps.get_version.outputs.version }}|View Release>"
