name: Endpoint Audit

on:
  push:
    branches: ['**']
  # Required for the "Comment audit report on PR" step: it is gated on
  # github.event_name == 'pull_request' and relies on the PR context
  # (context.issue.number), neither of which exists on a push event.
  pull_request:

# Needed so the audit can post its report as a comment on the PR.
permissions:
  contents: read
  pull-requests: write

jobs:
  # Report divergences between handwritten Agent Server calls and the pinned
  # server's OpenAPI contract. See scripts/endpoint-audit.mjs.
  endpoint-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test endpoint-audit tooling
        run: npm run test:endpoint-audit-tooling

      - name: Endpoint audit (report-only — client vs pinned release contract)
        run: npm run audit:endpoints

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endpoint-audit
          path: .audit/
          # .audit/ is a dot-directory; upload-artifact@v4 skips hidden paths by default.
          include-hidden-files: true

      # Publish the report. It always lands in the job summary, and additionally
      # as a single self-updating PR comment when the run's token can write one
      # (same-repo pull requests). Runs even when the audit gate fails (the
      # report is written before the gate), so reviewers see the mismatches that
      # failed the check.
      #
      # A fork pull_request runs with a read-only token, so the comment POST
      # returns 403 "Resource not accessible by integration". This step is
      # `if: always()`, so an unguarded POST failed the whole check on every
      # fork PR whatever the audit found. The guard lives in
      # post-endpoint-audit-report.cjs; see canCommentOnPullRequest.
      - name: Publish audit report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { postEndpointAuditReport } = require(
              './.github/scripts/post-endpoint-audit-report.cjs'
            );
            await postEndpointAuditReport({ github, context, core });
