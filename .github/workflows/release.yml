name: Release

# Publishes the package to GitHub Packages. The GitHub Release itself is now
# created by create-release.yml when a rel-X.Y.Z PR is merged; this workflow is
# dispatched by create-release.yml (and also runs if a release is published in
# the UI). For npmjs.org publishing see npm-publish.yml.

on:
  # Primary trigger: dispatched by create-release.yml against the new tag.
  # Also fires if a release is published directly in the GitHub UI.
  release:
    types: [published]
  # Manual re-publish for an already-released version.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish to GitHub Packages (no leading "v"), e.g. 1.25.0'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip publishing for pre-releases. A manual workflow_dispatch always runs.
    if: >
      github.event_name == 'workflow_dispatch' ||
      !github.event.release.prerelease

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js for GitHub Packages
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        registry-url: 'https://npm.pkg.github.com'
        scope: '@openhands'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Extract and set version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          TARGET_VERSION="${{ github.event.inputs.version }}"
        else
          TARGET_VERSION="${GITHUB_REF#refs/tags/v}"
        fi
        echo "Publishing version: $TARGET_VERSION"
        npm version "$TARGET_VERSION" --no-git-tag-version

    - name: Build package
      run: npm run build

    - name: Publish to GitHub Packages
      run: npm publish --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
