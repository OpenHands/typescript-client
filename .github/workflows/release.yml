name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # Gate the release on the endpoint audit: the client must not call endpoints
  # the released agent-server no longer exposes. The audit diffs the client's
  # HTTP surface against the live server's OpenAPI spec. See
  # scripts/endpoint-audit.mjs.
  endpoint-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENT_SERVER_PORT: 8010
      AGENT_SERVER_IMAGE: ghcr.io/openhands/agent-server:1.29.0-python
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start agent-server (ground-truth OpenAPI spec)
        run: |
          docker pull "${AGENT_SERVER_IMAGE}"
          docker run -d --name agent-server -p ${AGENT_SERVER_PORT}:8000 \
            -e LOG_JSON=true "${AGENT_SERVER_IMAGE}"
          for i in $(seq 1 30); do
            curl -sf http://localhost:${AGENT_SERVER_PORT}/health && break
            echo "waiting for agent-server ($i)..."; sleep 2
          done

      - name: Endpoint audit (gates on client/server mismatch)
        run: npm run audit:endpoints

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endpoint-audit
          path: .audit/

      - name: Stop agent-server
        if: always()
        run: docker rm -f agent-server || true

  release:
    runs-on: ubuntu-latest
    needs: endpoint-audit

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js for GitHub Packages
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        registry-url: 'https://npm.pkg.github.com'
        scope: '@openhands'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests
      run: npm test
      
    - name: Build package
      run: npm run build
      
    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
    - name: Update package version
      run: npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version
      
    - name: Publish to GitHub Packages
      run: npm publish --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
        body: |
          ## Installation from GitHub Packages
          
          ### Option 1: Configure .npmrc (Recommended)
          Add to your `.npmrc` file:
          ```
          @openhands:registry=https://npm.pkg.github.com
          ```
          
          Then install:
          ```bash
          npm install @openhands/typescript-client@${{ steps.version.outputs.VERSION }}
          ```
          
          ### Option 2: Direct install with registry flag
          ```bash
          npm install @openhands/typescript-client@${{ steps.version.outputs.VERSION }} --registry=https://npm.pkg.github.com
          ```
          
          ## Usage
          
          ```typescript
          import { RemoteConversation } from '@openhands/typescript-client';
          
          const conversation = new RemoteConversation({
            baseUrl: 'http://localhost:8000',
            apiKey: 'your-api-key'
          });
          ```