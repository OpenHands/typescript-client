name: release

# Release automation via release-please, using OpenHands' centralized reusable
# workflows (OpenHands/release-actions). This thin caller owns the trigger; the
# reusable workflow owns the logic.
#
# On every push to main (or a release/** maintenance branch), release-please
# maintains a "release PR" that, when merged, derives the next SemVer version
# from the Conventional-Commit PR titles merged since the last release, bumps
# package.json + package-lock.json, and creates the GitHub Release + tag
# (vX.Y.Z). That published release then drives the publish workflows
# (npm-publish.yml, publish-github-packages.yml) via their `release: published`
# triggers.
#
# Config lives in release-please-config.json + .release-please-manifest.json,
# and the release-notes grouping in .github/release.yml.
on:
  push:
    branches:
      - main
      # Maintenance/freeze branches (e.g. release/0.x). The reusable workflow
      # scopes the release to whichever branch triggered this run.
      - 'release/**'

jobs:
  release-please:
    # The caller must grant the permissions the reusable workflow needs; the
    # effective token is the intersection of the two.
    permissions:
      contents: write
      pull-requests: write
    # Passes the org-level RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY through so the
    # reusable workflow can mint a GitHub App token. This is required, not an
    # optimization: a release created by the default GITHUB_TOKEN would NOT
    # trigger the `release: published` publish jobs (GitHub's recursion guard),
    # so the App-token identity is what lets npm + GitHub Packages publishing fire.
    secrets: inherit
    uses: OpenHands/release-actions/.github/workflows/release-please.yml@main
